services:
  web:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    command: sh -c "alembic upgrade head && python -m beework.bootstrap && uvicorn beework.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://beework:beework_local_only@postgres:5432/beework}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      AUTH_SECRET: ${AUTH_SECRET:-local-only-change-this-secret-before-deploying}
      MODEL_CREDENTIALS_SECRET: ${MODEL_CREDENTIALS_SECRET:-local-only-model-credentials-secret}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Acme 科技}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-acme}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@beework.dev}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Olivia Lin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Beework-Dev-2026!}
      BOOTSTRAP_PLATFORM_ADMIN_EMAIL: ${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-platform@beework.dev}
      BOOTSTRAP_PLATFORM_ADMIN_NAME: ${BOOTSTRAP_PLATFORM_ADMIN_NAME:-BeeWork Platform Admin}
      BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: ${BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:-BeeWork-Platform-2026!}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-beework-local-only-master}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    command: python -m beework.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://beework:beework_local_only@postgres:5432/beework}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      # Runs execute here (LangGraph -> LiteLLM, Langfuse traces) and decrypt the tenant gateway keys.
      MODEL_CREDENTIALS_SECRET: ${MODEL_CREDENTIALS_SECRET:-local-only-model-credentials-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-beework-local-only-master}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # AI gateway. Runs from the upstream image; BeeWork only calls its HTTP API.
  litellm:
    # LiteLLM 1.106.0, pinned by digest (docker.litellm.ai registry).
    image: docker.litellm.ai/berriai/litellm@sha256:2e4c0371f3a8c28e4da131d77abaa8341cd3b0c2fcc4d34d7c5900431af7b9d0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-beework-local-only-master}
      # Encrypts provider keys stored in LiteLLM's own database; keep it stable.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-beework-local-only-salt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beework}:${POSTGRES_PASSWORD:-beework_local_only}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  litellm-db-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-beework_local_only}
      PGUSER: ${POSTGRES_USER:-beework}
    command: >-
      sh -c "psql -h postgres -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'litellm'\" | grep -q 1
      || psql -h postgres -d postgres -c 'CREATE DATABASE litellm'"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beework}
      POSTGRES_USER: ${POSTGRES_USER:-beework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beework_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
  frontend_node_modules:
